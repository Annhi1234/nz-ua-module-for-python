name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Тести бібліотеки
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: Підготовка застосунку
        run: sh scripts/sync_lib.sh

      - name: Збірка APK
        working-directory: app
        run: |
          pip install flet-cli==1.0.3
          flet build apk --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: nz-diary-apk
          path: app/build/apk/*.apk
