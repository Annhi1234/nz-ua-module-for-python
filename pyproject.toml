[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nzua"
version = "3.0.0"
description = "Неофіційна async/sync бібліотека для nz.ua (API v2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "curl_cffi>=0.7"]

[project.scripts]
nzua = "nzua.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "curl_cffi>=0.7", "h2>=4"]
http2 = ["h2>=4"]
qt = ["PyQt5>=5.15"]
flet = ["flet>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
